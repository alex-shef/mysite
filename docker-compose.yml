services:
  db:
    build:
      context: .
      dockerfile: Dockerfile_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=blog
      - POSTGRES_USER=blog
      - POSTGRES_PASSWORD=blog
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/mysite
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: