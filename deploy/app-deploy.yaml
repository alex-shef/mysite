apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      serviceAccountName: app-bucket
      imagePullSecrets:
      - name: github-packages-cfg
      containers:
      - name: django-app
        image: ghcr.io/alex-shef/django-app:replaceImageTag
        imagePullPolicy: Always
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: mysite.settings.prod
        - name: GCP_STORAGE_MEDIA_NAME
          value: 48642fdde6407be6-media-bucket
        - name: GCP_STORAGE_STATIC_NAME
          value: 48642fdde6407be6-static-bucket
        envFrom:
        - secretRef:
            name: kube-vault-secrets
        ports:
        - containerPort: 8000
        command:
        - sh
        - -c
        args:
        - python manage.py migrate && sleep 5 && python manage.py collectstatic --noinput && gunicorn --config deploy/gunicorn_config.py mysite.wsgi:application
